  <style>
    /* Palette ufficiale Nemea (NemeaOS, progetti/brand-identity/documentazione/reference/logo-e-colori.md) */
    :root {
      --carbon-shadow: #0a0a0a;
      --obsidian: #151516;
      --polar-white: #f5f5f5;
      --silver-chrome: #a8aaad;
      --titanium-grey: #55565a;
      --crimson-red: #9b0b0e;
      --highlights-red: #d01c1f;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: var(--carbon-shadow);
      color: var(--polar-white);
      font-family: 'Urbanist', Arial, sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 5vw, 64px);
      background:
        linear-gradient(to top, var(--carbon-shadow) 8%, rgba(10, 10, 10, 0.55) 55%, rgba(10, 10, 10, 0.85)),
        url('../img/carbonio.jpg') center / cover no-repeat;
    }

    @media (max-width: 700px) {
      .hero {
        background:
          linear-gradient(to top, var(--carbon-shadow) 20%, rgba(10, 10, 10, 0.6) 60%, rgba(10, 10, 10, 0.9)),
          url('../img/carbonio-960.jpg') center / cover no-repeat;
      }
    }

    .logo { width: clamp(150px, 22vw, 240px); height: auto; }

    .content { max-width: 760px; }

    .kicker {
      color: var(--silver-chrome);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .kicker::before {
      content: '';
      display: inline-block;
      width: 32px;
      height: 2px;
      background: var(--highlights-red);
      vertical-align: middle;
      margin-right: 12px;
    }

    h1 {
      font-size: clamp(2.4rem, 6.5vw, 5rem);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.01em;
    }

    .lead {
      margin-top: 24px;
      max-width: 34em;
      color: var(--silver-chrome);
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      font-weight: 300;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 24px;
      margin-top: 48px;
      color: var(--titanium-grey);
      font-size: 0.85rem;
    }

    footer a { color: var(--silver-chrome); text-decoration: none; }

    footer a:hover { color: var(--polar-white); }

    /* Lingue: una pagina per lingua, in alto a destra (EN DE ES FR IT) */
    .langs { position: absolute; top: clamp(24px, 5vw, 64px); right: clamp(16px, 5vw, 64px); display: flex; gap: 2px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em; }

    .langs a { padding: 6px 7px; color: var(--titanium-grey); text-decoration: none; }

    .langs a[aria-current="page"] { color: var(--polar-white); }

    .langs a:hover { color: var(--silver-chrome); }

    /* WIP: puntini che si animano, come un lavoro in corso */
    .wip::after { content: ""; display: inline-block; width: 1.6em; text-align: left; animation: wip 1.6s steps(4, end) infinite; }

    @keyframes wip { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }

    @media (prefers-reduced-motion: reduce) { .wip::after { animation: none; content: "..."; } }
